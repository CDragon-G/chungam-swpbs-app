# Codemagic CI/CD — 자람(Jaram) iOS 출시 워크플로우
# 무료 플랜: macOS M2 인스턴스, 월 500분, 빌드당 120분 제한

workflows:
  ios-testflight:
    name: iOS TestFlight 배포
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: jaram-asc-key
    environment:
      groups:
        - supabase
      vars:
        APP_STORE_APPLE_ID: 6780309774
        BUNDLE_ID: "com.jaram.app"
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: .env 파일 생성
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Flutter 의존성 설치
        script: |
          flutter packages pub get

      - name: Pod install (Xcode 프로젝트 설정 완성)
        # 코드 서명 전에 먼저 Pod 설치 — Xcode 프로젝트 설정 완성 필요
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: iOS 코드 서명 (인증서·프로비저닝 자동 생성 + xcconfig 주입)
        # 신규 Apple Developer 계정용: private key를 명시 생성 후 전달
        # + Release.xcconfig에 서명 설정 강제 주입 (Flutter 자동 서명 실패 우회)
        script: |
          set -e
          keychain initialize

          # 1. RSA 2048 private key 생성 (PEM 포맷)
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/apple_dist_pk -q -N ""

          # 2. Apple에 인증서·프로파일 자동 등록 + 다운로드
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/apple_dist_pk \
            --create

          # 3. 키체인에 인증서 등록
          keychain add-certificates

          # 4. Xcode 프로젝트에 프로파일 적용 (RunnerTests 매칭 실패는 무시)
          xcode-project use-profiles --warn-only

          # 5. 프로파일에서 Team ID·Profile Name 추출 → Release.xcconfig 강제 주입
          PROFILE_PATH=$(ls "/Users/builder/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision | head -1)
          TEAM_ID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract TeamIdentifier.0 raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)

          echo "✅ Team ID: $TEAM_ID"
          echo "✅ Profile Name: $PROFILE_NAME"

          cat >> ios/Flutter/Release.xcconfig <<EOF

          // Codemagic CI 자동 코드 서명 (Flutter automatic signing 우회)
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          EOF

          echo "─── Release.xcconfig 내용 ───"
          cat ios/Flutter/Release.xcconfig

          # 6. export_options.plist 직접 생성 (xcode-project 자동 생성본은 ad-hoc + array 포맷 버그)
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.jaram.app</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

          echo "─── export_options.plist 내용 ───"
          cat /Users/builder/export_options.plist

      - name: 빌드 번호 자동 증가 + IPA 빌드
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo "0")
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "Setting build number to $NEW_BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=0.4.0 \
            --build-number=$NEW_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - 내부테스터

      email:
        recipients:
          - godspeardragon@gmail.com
        notify:
          success: true
          failure: true

# Codemagic CI/CD — 자람(Jaram) iOS 출시 워크플로우
# 무료 플랜: macOS M2 인스턴스, 월 500분, 빌드당 120분 제한

workflows:
  ios-testflight:
    name: iOS TestFlight 배포
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: jaram-asc-key
    environment:
      groups:
        - supabase
      vars:
        APP_STORE_APPLE_ID: 6780309774
        BUNDLE_ID: "com.jaram.app"
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: .env 파일 생성
        script: |
          # 환경변수 확인 (디버그)
          echo "─── 환경변수 확인 ───"
          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ ERROR: SUPABASE_URL이 비어있어요!"
            echo "Codemagic UI → Environment variables → supabase 그룹 확인 필요"
            exit 1
          else
            echo "✅ SUPABASE_URL 길이: ${#SUPABASE_URL}자"
            echo "✅ SUPABASE_URL 앞 30자: ${SUPABASE_URL:0:30}..."
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ ERROR: SUPABASE_ANON_KEY가 비어있어요!"
            exit 1
          else
            echo "✅ SUPABASE_ANON_KEY 길이: ${#SUPABASE_ANON_KEY}자"
          fi

          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

          echo "─── 생성된 .env 파일 ───"
          # 보안 위해 key는 일부만 표시
          head -1 .env
          echo "SUPABASE_ANON_KEY=$(echo $SUPABASE_ANON_KEY | cut -c1-20)..."

      - name: Flutter 의존성 설치
        script: |
          flutter packages pub get

      - name: Pod install (Xcode 프로젝트 설정 완성)
        # 코드 서명 전에 먼저 Pod 설치 — Xcode 프로젝트 설정 완성 필요
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: iOS 코드 서명 (고정 키로 인증서 재사용 + xcconfig 주입)
        # 고정 private key를 환경변수(IOS_CERT_PRIVATE_KEY)에서 복원해 사용한다.
        # 같은 key를 매번 쓰므로 첫 빌드에서 만든 인증서를 계속 재사용 →
        # Apple 인증서 한도 초과/폐기 반복이 사라진다.
        script: |
          set -e
          keychain initialize

          # 1. 환경변수에서 고정 private key 복원
          echo "$IOS_CERT_PRIVATE_KEY" | base64 --decode > /tmp/apple_dist_pk
          chmod 600 /tmp/apple_dist_pk

          # 2. 이 key에 매칭되는 인증서를 Apple에서 가져옴 (없으면 생성, 있으면 재사용)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/apple_dist_pk \
            --create

          # 3. 키체인에 인증서 등록
          keychain add-certificates

          # 4. Xcode 프로젝트에 프로파일 적용 (RunnerTests 매칭 실패는 무시)
          xcode-project use-profiles --warn-only

          # 5. 프로파일에서 Team ID·Profile Name 추출 → Release.xcconfig 강제 주입
          PROFILE_PATH=$(ls "/Users/builder/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision | head -1)
          TEAM_ID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract TeamIdentifier.0 raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)

          echo "✅ Team ID: $TEAM_ID"
          echo "✅ Profile Name: $PROFILE_NAME"

          cat >> ios/Flutter/Release.xcconfig <<EOF

          // Codemagic CI 자동 코드 서명 (Flutter automatic signing 우회)
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          EOF

          echo "─── Release.xcconfig 내용 ───"
          cat ios/Flutter/Release.xcconfig

          # 6. export_options.plist 직접 생성 (xcode-project 자동 생성본은 ad-hoc + array 포맷 버그)
          cat > /Users/builder/export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.jaram.app</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

          echo "─── export_options.plist 내용 ───"
          cat /Users/builder/export_options.plist

      - name: 빌드 번호 자동 증가 + IPA 빌드
        script: |
          # 빌드 번호: Unix 타임스탬프(초)로 지정 → 항상 단조 증가하고 절대 충돌하지 않음.
          # (기존 get-latest-build-number 방식이 최신 빌드(6)를 못 읽어 5+1=6으로 계산,
          #  이미 업로드된 6과 중복되어 업로드 실패했음. 타임스탬프는 ~1.75e9로
          #  uint32 한도(4.29e9) 안이라 2106년까지 안전.)
          NEW_BUILD_NUMBER=$(date +%s)
          echo "Setting build number to: $NEW_BUILD_NUMBER"
          # --build-name 생략 → pubspec.yaml의 version을 자동 사용 (0.4.2)
          # --build-number만 TestFlight 충돌 방지용으로 자동 증가
          flutter build ipa --release \
            --build-number=$NEW_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - 내부테스터

      email:
        recipients:
          - godspeardragon@gmail.com
        notify:
          success: true
          failure: true

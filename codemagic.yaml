# Codemagic CI/CD — 자람(Jaram) iOS 출시 워크플로우
# 무료 플랜: macOS M2 인스턴스, 월 500분, 빌드당 120분 제한
# 참고: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# ⚠️ 신규 Apple Developer 계정용 설정:
# ios_signing 자동 모드는 "기존 인증서 찾기"만 하므로 신규 계정에서 실패함.
# 대신 fetch-signing-files --create 명령으로 명시적으로 만들어야 함.

workflows:
  ios-testflight:
    name: iOS TestFlight 배포
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: jaram-asc-key
    environment:
      groups:
        - supabase
      vars:
        APP_STORE_APPLE_ID: 6780309774
        BUNDLE_ID: "com.jaram.app"
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: .env 파일 생성
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Flutter 의존성 설치
        script: |
          flutter packages pub get

      - name: iOS 코드 서명 (인증서·프로비저닝 자동 생성)
        # 핵심: 신규 Apple Developer 계정용.
        # private key를 먼저 생성한 뒤 --certificate-key로 전달해야
        # Apple이 "Cannot save Signing Certificates without certificate private key" 에러를 안 냄.
        script: |
          set -e
          keychain initialize

          # 1. RSA 2048 private key 생성 (PEM 포맷, Apple 요구사항)
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/apple_dist_pk -q -N ""

          # 2. Apple에 인증서·프로파일 자동 등록 + 다운로드 (private key 함께 전달)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/apple_dist_pk \
            --create

          # 3. 키체인에 인증서 등록
          keychain add-certificates

          # 4. Flutter Xcode 프로젝트에 프로파일 자동 적용
          xcode-project use-profiles

      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: 빌드 번호 자동 증가 + IPA 빌드
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo "0")
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "Setting build number to $NEW_BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=0.4.0 \
            --build-number=$NEW_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - 내부테스터

      email:
        recipients:
          - godspeardragon@gmail.com
        notify:
          success: true
          failure: true

# Codemagic CI/CD — 자람(Jaram) iOS 출시 워크플로우
# 무료 플랜: macOS M2 인스턴스, 월 500분, 빌드당 120분 제한
# 참고: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

workflows:
  ios-testflight:
    name: iOS TestFlight 배포
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: jaram-asc-key   # Codemagic UI에서 등록한 API Key 이름
    environment:
      groups:
        - supabase   # Codemagic UI에 등록한 환경변수 그룹 (SUPABASE_URL, SUPABASE_ANON_KEY)
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jaram.app
      vars:
        APP_STORE_APPLE_ID: 6780309774   # 자람(Jaram) App Store Connect ID
        BUNDLE_ID: "com.jaram.app"
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: .env 파일 생성
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

      - name: Flutter 의존성 설치
        script: |
          flutter packages pub get

      - name: iOS 코드 서명 (인증서·프로비저닝 자동 생성)
        # 핵심: 신규 Apple Developer 계정에는 인증서가 없음.
        # 아래 명령이 Codemagic Mac 인스턴스에서 CSR 생성 → Apple에 등록 → 다운로드 → 키체인 등록까지 자동 처리.
        script: |
          keychain initialize

          # 인증서/프로파일이 없으면 생성, 있으면 가져옴
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates

          # Flutter Xcode 프로젝트에 자동 적용
          xcode-project use-profiles

      - name: Pod install
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: 빌드 번호 자동 증가 + IPA 빌드
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo "0")
          NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "Setting build number to $NEW_BUILD_NUMBER"
          flutter build ipa --release \
            --build-name=0.4.0 \
            --build-number=$NEW_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - 내부테스터        # App Store Connect TestFlight에서 만든 그룹 이름 (없으면 이 줄 삭제)

      email:
        recipients:
          - godspeardragon@gmail.com
        notify:
          success: true
          failure: true
